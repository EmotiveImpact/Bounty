<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Bounty</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400..700&display=swap" />
    <style>
      @font-face {
        font-family: "Cal Sans";
        src: url("/fonts/CalSans-latin.woff2") format("woff2");
        font-weight: 600;
        font-display: swap;
      }
      :root {
        --ink: #111111;
        --muted: #64626e;
        --line: #e8e6ee;
        --lime: #d6f86b;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #fff; color: var(--ink); }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        font: 400 16px/1.5 "Google Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      }
      main {
        width: 100%;
        max-width: 760px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 260px;
        align-items: center;
        gap: 32px;
      }
      .word { font: 600 15px/1 "Cal Sans", system-ui, sans-serif; letter-spacing: 0.04em; margin: 0 0 18px; }
      h1 { font: 600 clamp(34px, 6vw, 52px)/1.05 "Cal Sans", system-ui, sans-serif; margin: 0 0 14px; }
      p { margin: 0 0 24px; color: var(--muted); max-width: 40ch; }
      a.btn {
        display: inline-block;
        padding: 13px 22px;
        border-radius: 999px;
        background: var(--lime);
        color: var(--ink);
        font-weight: 600;
        text-decoration: none;
      }
      a.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
      img {
        display: block;
        width: 100%;
        aspect-ratio: 2 / 3;
        object-fit: cover;
        border-radius: 24px;
        background: #fff;
        filter: brightness(1.04);
      }
      @media (max-width: 640px) {
        main { grid-template-columns: 1fr; gap: 20px; text-align: left; }
        img { width: 180px; justify-self: center; order: -1; }
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <p class="word">BOUNTY</p>
        <h1>This page has wandered off.</h1>
        <p>The link may be old or mistyped. The deals are still where you left them.</p>
        <a class="btn" href="/">Back to the deals</a>
      </div>
      <img src="/crew/scout-map.jpg" alt="The Scout, puzzling over a street map." />
    </main>
  </body>
</html>
