name: Durable snapshot checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm test
      - name: Reproduce ledger and mobile state failures on the isolated parent
        run: node tools/account-retry-before.mjs
      - run: npm run build
      - name: Mobile static checks
        working-directory: apps/mobile
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=moderate
          npm run lint
          npx tsc --noEmit
          CI=1 EXPO_NO_TELEMETRY=1 EXPO_PUBLIC_API_URL=http://127.0.0.1:9 npx expo export --platform web --output-dir "$RUNNER_TEMP/bounty-mobile-export"
      - name: Native PostgreSQL failure and restart lab
        run: |
          npm install --prefix "$RUNNER_TEMP/bounty-pg-lab" --no-save --ignore-scripts embedded-postgres@18.6.0-beta.19
          BOUNTY_PG_LAB_MODULE="$RUNNER_TEMP/bounty-pg-lab/node_modules/embedded-postgres/dist/index.js" node --test tools/keep-postgres-lab.mjs
      - name: Browser regression suite with synthetic data
        run: |
          npm install --prefix "$RUNNER_TEMP/bounty-browser" --no-save --ignore-scripts playwright@1.65.0
          node "$RUNNER_TEMP/bounty-browser/node_modules/playwright/cli.js" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/bounty-browser/node_modules" npm run e2e
      - name: Reproduce browser security failures on the isolated parent
        run: NODE_PATH="$RUNNER_TEMP/bounty-browser/node_modules" node tools/security-browser-before.mjs
